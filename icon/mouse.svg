<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
  <!-- 鼠标 + 充电闪电。
       需求：小图标复用「手机充电」的观感，但要能看出是什么设备 ——
       机身形状负责「这是鼠标」，闪电负责「这是电量/充电」。
       不用 <mask>：内联到页面后 mask 的 id 会随实例重复，多设备同时渲染
       时后一个会顶掉前一个的定义。直接两层实心图形叠画最稳。 -->
  <path fill="currentColor"
        d="M11 2.4C8.24 2.4 6 4.64 6 7.4v9.2c0 2.76 2.24 5 5 5s5-2.24 5-5V7.4c0-2.76-2.24-5-5-5Z"/>
  <path fill="#ffffff"
        d="M11 4.6c.62 0 1.12.5 1.12 1.12v2.5c0 .62-.5 1.12-1.12 1.12s-1.12-.5-1.12-1.12v-2.5c0-.62.5-1.12 1.12-1.12Z"/>
  <path fill="#2da44e"
        d="M19.1 2.2 15 8.9h2.8l-1 5 4.5-7.1h-2.9l.7-4.6Z"/>
</svg>
